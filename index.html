<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3d91"><title>הספורט שלי</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef2f9;--card:#fff;--tx:#14213d;--mu:#667290;--pr:#0b3d91;--bd:#d9e0ee;--chip:#e3eaf7;--ac:#e8a200}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--card:#18213a;--tx:#eef2ff;--mu:#9aa7c7;--pr:#6c9bff;--bd:#2a3556;--chip:#222d4d}}
:root[data-theme="dark"]{--bg:#0e1424;--card:#18213a;--tx:#eef2ff;--mu:#9aa7c7;--pr:#6c9bff;--bd:#2a3556;--chip:#222d4d}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:30px}
header{background:#0b3d91;color:#fff;padding:14px 14px 8px}header h1{margin:0 0 8px;font-size:22px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.tab{flex:none;border:0;border-radius:18px;padding:9px 14px;font:inherit;font-size:15px;background:rgba(255,255,255,.18);color:#fff}
.tab.on{background:#fff;color:#0b3d91;font-weight:700}
.sub{display:flex;gap:6px;padding:10px 12px;overflow-x:auto}
.chip{flex:none;border:1px solid var(--bd);background:var(--chip);color:var(--tx);border-radius:18px;padding:8px 14px;font:inherit;font-size:14px}
.chip.on{background:var(--pr);color:var(--bg);border-color:var(--pr)}
.w{padding:10px 12px;display:grid;gap:10px}
.g{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.g.p{opacity:.72}.g.n{border-color:var(--ac);border-width:2px}
.lg{font-size:12px;color:var(--mu)}.tm{font-weight:700;font-size:17px;margin:4px 0}
.dt{font-size:14px;color:var(--mu)}.sc{font-size:22px;font-weight:800;color:var(--pr)}
.dy{font-weight:700;color:var(--mu);padding:6px 2px 0}
.msg{padding:24px 16px;text-align:center;color:var(--mu);line-height:1.7}
.box{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--bd)}td.t{text-align:right;font-weight:600}
tr.me{background:var(--chip);font-weight:800}
.pl{display:flex;gap:10px;align-items:center}.pl img{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--chip)}
input,select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;width:100%}
a.b,button.b{display:block;text-align:center;text-decoration:none;border:0;background:var(--pr);color:var(--bg);border-radius:12px;padding:13px;font:inherit;font-weight:700;margin-top:8px;width:100%}
.rs{display:flex;gap:10px;align-items:center;width:100%;text-align:right;color:var(--tx);font:inherit}.rs img{width:40px;height:40px;object-fit:contain}
.hd{display:flex;align-items:center;gap:10px;padding:12px}.hd img{width:52px;height:52px;object-fit:contain}.hd b{font-size:20px}
</style></head><body>
<header><h1>⚽ הספורט שלי <button class="tab" id="rf" style="float:left">🔄</button></h1><div id="up" style="font-size:12px;opacity:.8;margin:-4px 0 6px"></div><div class="tabs" id="tb"></div></header>
<div id="v"></div>
<script>
var API='https://www.thesportsdb.com/api/v1/json/3/';
var TEAMS=[{k:'real',n:'ריאל מדריד',q:'Real Madrid',s:'Soccer',f:1},{k:'haifa',n:'מכבי חיפה',q:'Maccabi Haifa',s:'Soccer',f:1},{k:'isr',n:'נבחרת ישראל',q:'Israel',s:'Soccer',f:1},{k:'ess',n:'אסנדון',q:'Essendon',s:'Australian'}];
var HE={'Real Madrid':'ריאל מדריד','Maccabi Haifa':'מכבי חיפה','Maccabi Tel Aviv':'מכבי תל אביב','Barcelona':'ברצלונה','Israel':'ישראל','Hapoel Beer Sheva':'הפועל באר שבע','Beitar Jerusalem':'בית"ר ירושלים','Essendon':'אסנדון'};
var G='https://www.google.com/search?hl=iw&q=';
var LG=[{id:'4644',n:'ליגת העל',soc:1,u:G+'%D7%98%D7%91%D7%9C%D7%AA+%D7%9C%D7%99%D7%92%D7%AA+%D7%94%D7%A2%D7%9C'},{id:'4335',n:'לה ליגה',soc:1,u:G+'%D7%98%D7%91%D7%9C%D7%AA+%D7%9C%D7%94+%D7%9C%D7%99%D7%92%D7%94'},{id:'4480',n:'ליגת האלופות',soc:1,u:G+'%D7%98%D7%91%D7%9C%D7%AA+%D7%9C%D7%99%D7%92%D7%AA+%D7%94%D7%90%D7%9C%D7%95%D7%A4%D7%95%D7%AA'},{id:'4656',n:'AFL',soc:0,u:'https://www.afl.com.au/ladder',t:'הטבלה באתר ה-AFL'}],lgi=0,tseason='',MY=['Real Madrid','Maccabi Haifa','Essendon','Israel'];
var info={},evs={},err={},cur='all',sub='table',season='';
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function he(n){return HE[n]||n}
function J(p,ttl){var k='c:'+p,now=Date.now();
  try{var c=JSON.parse(localStorage.getItem(k)||'null');if(c&&now-c.t<ttl)return Promise.resolve(c.d)}catch(e){}
  return fetch(API+p).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){try{localStorage.setItem(k,JSON.stringify({t:now,d:d}))}catch(e){}return d})
  .catch(function(e){try{var c=JSON.parse(localStorage.getItem(k)||'null');if(c)return c.d}catch(x){}throw e})}
function resolve(t){return J('searchteams.php?t='+encodeURIComponent(t.q),30*864e5).then(function(d){
  var a=(d.teams||[]).filter(function(x){return x.strTeam.indexOf(t.q)===0&&(x.strSport||'').indexOf(t.s)>=0});
  var ex=a.filter(function(x){return x.strTeam===t.q});return ex[0]||a[0]||null})}
function ts(e){return new Date(e.dateEvent+'T'+(e.strTime||'12:00:00')+'Z').getTime()}
function done(e){return e.intHomeScore!=null&&e.intHomeScore!==''}
function tabs(){$('tb').innerHTML=[{k:'all',n:'📅 משחקים'},{k:'tbl',n:'🏆 טבלאות'},{k:'srch',n:'🔎 חיפוש'}].concat(TEAMS).map(function(t){return'<button class="tab'+(cur===t.k?' on':'')+'" data-k="'+t.k+'">'+esc(t.n)+'</button>'}).join('')}
function games(){
  var seen={},all=[];TEAMS.forEach(function(t){(evs[t.k]||[]).forEach(function(e){if(e&&e.idEvent&&!seen[e.idEvent]&&e.dateEvent){seen[e.idEvent]=1;all.push(e)}})});
  all.sort(function(a,b){return ts(a)-ts(b)});
  if(!all.length){$('v').innerHTML='<div class="msg">'+(Object.keys(info).length?'לא נמצאו משחקים כרגע.':'טוען משחקים...')+'</div>';return}
  var now=Date.now(),first=true,day='',h='<div class="w">';
  all.forEach(function(e){var d=new Date(ts(e)),dk=d.toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'numeric'});
    var tm=e.strTime?d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}):'';
    var isDone=done(e),nx=!isDone&&ts(e)>now-72e5&&first;if(nx)first=false;
    if(dk!==day){day=dk;h+='<div class="dy">'+esc(dk)+'</div>'}
    h+='<div class="g '+(isDone?'p':nx?'n':'')+'"'+(nx?' id="nx"':'')+'><div class="lg">'+esc(e.strLeague||'')+'</div><div class="tm">'+esc(he(e.strHomeTeam))+' נגד '+esc(he(e.strAwayTeam))+'</div>'+
    (isDone?'<div class="sc">'+esc(e.intHomeScore)+' - '+esc(e.intAwayScore)+'</div>':'<div class="dt">'+esc(tm)+'</div>')+'</div>'});
  var bad=TEAMS.filter(function(t){return err[t.k]}).map(function(t){return t.n});
  if(bad.length)h+='<div class="msg">לא הצלחתי לטעון: '+esc(bad.join(', '))+'</div>';
  $('v').innerHTML=h+'</div>';var n=$('nx');if(n&&!games.sc){games.sc=1;n.scrollIntoView({block:'start'})}}
function seasons(t){var d=new Date(),y=d.getFullYear(),a=[],i;if(t.s==='Soccer'){var b=d.getMonth()>=6?y:y-1;for(i=0;i<8;i++)a.push((b-i)+'-'+(b-i+1))}else for(i=0;i<8;i++)a.push(String(y-i));return a}
function teamView(){
  var t=TEAMS.filter(function(x){return x.k===cur})[0],x=info[cur];
  if(!x){$('v').innerHTML='<div class="msg">'+(err[cur]?'לא הצלחתי למצוא את הקבוצה. בדוק חיבור לאינטרנט.':'טוען...')+'</div>';return}
  var ss=[['table','🏆 טבלה'],['pl','👥 שחקנים'],['news','📰 חדשות']];if(t.f)ss.push(['live','📺 צפייה']);
  var h='<div class="hd"><img src="'+esc(x.strBadge||'')+'" alt=""><b>'+esc(t.n)+'</b></div><div class="sub">'+ss.map(function(s){return'<button class="chip'+(sub===s[0]?' on':'')+'" data-s="'+s[0]+'">'+s[1]+'</button>'}).join('')+'</div><div class="w" id="tc"><div class="msg">טוען...</div></div>';
  $('v').innerHTML=h;var c=$('tc');
  if(sub==='table'){var ls=seasons(t);if(!season||ls.indexOf(season)<0)season=ls[0];
    c.innerHTML='<select id="se">'+ls.map(function(s){return'<option'+(s===season?' selected':'')+'>'+s+'</option>'}).join('')+'</select><div id="tt" class="g box"><div class="msg">טוען...</div></div>';
    $('se').onchange=function(){season=this.value;teamView()};
    J('lookuptable.php?l='+x.idLeague+'&s='+season,3e5).then(function(d){var r=d.table;
      $('tt').innerHTML=r&&r.length?'<table><tr><th>#</th><th>קבוצה</th><th>מש׳</th><th>הפרש</th><th>נק׳</th></tr>'+r.map(function(q){return'<tr'+(q.idTeam===x.idTeam?' class="me"':'')+'><td>'+esc(q.intRank)+'</td><td class="t">'+esc(he(q.strTeam))+'</td><td>'+esc(q.intPlayed)+'</td><td>'+esc(q.intGoalDifference)+'</td><td>'+esc(q.intPoints)+'</td></tr>'}).join('')+'</table>':'<div class="msg">אין טבלה זמינה בחינם לליגה או לעונה הזאת.</div>'}).catch(function(){$('tt').innerHTML='<div class="msg">לא הצלחתי לטעון את הטבלה.</div>'})}
  else if(sub==='pl'){J('lookup_all_players.php?id='+x.idTeam,864e5).then(function(d){var p=d.player;
      c.innerHTML=p&&p.length?p.map(function(q){return'<div class="g pl"><img src="'+esc(q.strCutout||q.strThumb||'')+'" alt=""><div><b>'+esc(q.strPlayer)+'</b><div class="dt">'+esc(q.strPosition||'')+(q.strNumber?' · '+esc(q.strNumber):'')+'</div></div></div>'}).join(''):'<div class="msg">אין רשימת שחקנים זמינה לקבוצה הזאת.</div>'}).catch(function(){c.innerHTML='<div class="msg">לא הצלחתי לטעון שחקנים.</div>'})}
  else if(sub==='news'){var q=encodeURIComponent(x.strTeam+' '+(t.s==='Soccer'?'':'AFL')+' news');
    c.innerHTML='<div class="g"><div class="dt">חדשות מתעדכנות נפתחות באתר חיפוש, בלי התחברות.</div><a class="b" target="_blank" rel="noopener" href="https://www.google.com/search?tbm=nws&hl=iw&q='+q+'">📰 חדשות על '+esc(t.n)+'</a><a class="b" target="_blank" rel="noopener" href="https://www.google.com/search?tbm=nws&hl=iw&q='+encodeURIComponent(t.n)+'">📰 חדשות בעברית</a></div>'}
  else{var key='live:'+cur,u='';try{u=localStorage.getItem(key)||''}catch(e){}
    c.innerHTML='<div class="g"><div class="dt">הדבק פעם אחת את הכתובת של אתר הצפייה שלך:</div><input id="lu" dir="ltr" placeholder="https://..." value="'+esc(u)+'"><button class="b" id="ls">💾 שמור</button>'+(u?'<a class="b" target="_blank" rel="noopener" href="'+esc(u)+'">📺 פתח את אתר הצפייה</a>':'')+'</div>';
    $('ls').onclick=function(){var v=$('lu').value.trim();if(v&&!/^https?:\/\//i.test(v))v='https://'+v;try{localStorage.setItem(key,v)}catch(e){}teamView()}}}
function rowsHTML(r,mine){return'<table><tr><th>#</th><th>קבוצה</th><th>מש׳</th><th>הפרש</th><th>נק׳</th></tr>'+r.map(function(q){return'<tr'+(mine(q)?' class="me"':'')+'><td>'+esc(q.intRank)+'</td><td class="t">'+esc(he(q.strTeam))+'</td><td>'+esc(q.intPlayed)+'</td><td>'+esc(q.intGoalDifference)+'</td><td>'+esc(q.intPoints)+'</td></tr>'}).join('')+'</table>'}
function tblView(){var L=LG[lgi],ls=seasons({s:L.soc?'Soccer':'A'});if(ls.indexOf(tseason)<0)tseason=ls[0];
  $('v').innerHTML='<div class="sub">'+LG.map(function(l,i){return'<button class="chip'+(i===lgi?' on':'')+'" data-l="'+i+'">'+l.n+'</button>'}).join('')+'</div><div class="w"><a class="b" target="_blank" rel="noopener" href="'+esc(L.u)+'">🔎 '+(L.t||'הטבלה העדכנית ביותר')+'</a><div class="dt" style="margin-top:-2px">הכפתור פותח את הטבלה העדכנית. למטה: גרסה מהמקור החינמי, שעלולה להתעכב.</div><select id="se">'+ls.map(function(x){return'<option'+(x===tseason?' selected':'')+'>'+x+'</option>'}).join('')+'</select><div id="tt" class="g box"><div class="msg">טוען...</div></div></div>';
  $('se').onchange=function(){tseason=this.value;tblView()};
  J('lookuptable.php?l='+L.id+'&s='+tseason,3e5).then(function(d){var r=d.table;$('tt').innerHTML=r&&r.length?rowsHTML(r,function(q){return MY.indexOf(q.strTeam)>=0}):'<div class="msg">אין טבלה זמינה לעונה הזאת. נסה עונה אחרת.</div>'}).catch(function(){$('tt').innerHTML='<div class="msg">לא הצלחתי לטעון את הטבלה. בדוק חיבור לאינטרנט.</div>'})}
var sq='',sres=null,sdet='';
function evCard(e,lab){var d=new Date(ts(e)),dk=d.toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'numeric',year:'numeric'}),tm=e.strTime?d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}):'';
  return'<div class="g"><div class="lg">'+lab+' · '+esc(e.strLeague||'')+'</div><div class="tm">'+esc(he(e.strHomeTeam))+' נגד '+esc(he(e.strAwayTeam))+'</div>'+(done(e)?'<div class="sc">'+esc(e.intHomeScore)+' - '+esc(e.intAwayScore)+'</div>':'')+'<div class="dt">'+esc(dk+(tm?' · '+tm:''))+'</div></div>'}
function drawSr(){var r=$('sr');if(!r)return;
  if(sres===null){r.innerHTML='';return}
  r.innerHTML=(sres.length?sres.map(function(t,i){return'<button class="g rs" data-t="'+i+'"><img src="'+esc(t.strBadge||'')+'" alt=""><div><b>'+esc(t.strTeam)+'</b><div class="dt">'+esc((t.strSport||'')+' · '+(t.strLeague||t.strCountry||''))+'</div></div></button>'}).join(''):'<div class="msg">לא נמצאה קבוצה. נסה לכתוב את השם באנגלית.</div>')+(sdet?'<div id="sd">'+sdet+'</div>':'')}
function doSearch(){sq=$('sq').value.trim();if(!sq)return;sdet='';sres=null;$('sr').innerHTML='<div class="msg">מחפש...</div>';
  var q=sq;Object.keys(HE).forEach(function(k){if(HE[k]===sq)q=k});
  J('searchteams.php?t='+encodeURIComponent(q),864e5).then(function(d){sres=d.teams||[];drawSr()}).catch(function(){$('sr').innerHTML='<div class="msg">החיפוש נכשל. בדוק חיבור לאינטרנט.</div>'})}
function loadDet(i){var t=sres[i];sdet='<div class="msg">טוען משחקים של '+esc(t.strTeam)+'...</div>';drawSr();
  Promise.all([J('eventslast.php?id='+t.idTeam,12e4),J('eventsnext.php?id='+t.idTeam,12e4)]).then(function(r){
    var past=(r[0].results||[]).filter(done).sort(function(a,b){return ts(b)-ts(a)}),nx=(r[1].events||[]).filter(function(e){return !done(e)}).sort(function(a,b){return ts(a)-ts(b)});
    var h='<div class="hd"><img src="'+esc(t.strBadge||'')+'" alt=""><b>'+esc(t.strTeam)+'</b></div>';
    h+=past[0]?evCard(past[0],'המשחק האחרון'):'<div class="g dt">אין תוצאה אחרונה זמינה.</div>';
    h+=nx[0]?evCard(nx[0],'המשחק הקרוב'):'<div class="g dt">אין משחק קרוב זמין.</div>';
    if(nx[1])h+=evCard(nx[1],'המשחק הבא אחריו');
    sdet=h;drawSr()}).catch(function(){sdet='<div class="msg">לא הצלחתי לטעון משחקים.</div>';drawSr()})}
function srchView(){$('v').innerHTML='<div class="w"><input id="sq" dir="ltr" placeholder="שם קבוצה, למשל Barcelona" value="'+esc(sq)+'"><button class="b" id="sg">🔎 חפש</button><div id="sr"></div></div>';
  $('sg').onclick=doSearch;$('sq').onkeydown=function(e){if(e.key==='Enter')doSearch()};drawSr()}
function show(){tabs();if(cur==='srch'){if(!$('sq'))srchView();return}cur==='all'?games():cur==='tbl'?tblView():teamView()}
$('tb').onclick=function(e){var b=e.target.closest('[data-k]');if(b){cur=b.dataset.k;sub='table';show()}};
$('v').onclick=function(e){var tt=e.target.closest('[data-t]');if(tt){loadDet(+tt.dataset.t);return}
  var l=e.target.closest('[data-l]');if(l){lgi=+l.dataset.l;tblView();return}
  var b=e.target.closest('[data-s]');if(b){sub=b.dataset.s;teamView()}};
function loadAll(){show();return Promise.all(TEAMS.map(function(t){resolve(t).then(function(x){if(!x)throw 0;info[t.k]=x;return Promise.all([J('eventsnext.php?id='+x.idTeam,12e4),J('eventslast.php?id='+x.idTeam,12e4)])}).then(function(r){evs[t.k]=(r[0].events||[]).concat(r[1].results||[]);show()}).catch(function(){err[t.k]=1;show()})})).then(function(){var d=new Date();$('up').textContent='עודכן '+d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'})})}
function refresh(){try{Object.keys(localStorage).forEach(function(k){if(/^c:(eventsnext|eventslast|lookuptable)/.test(k))localStorage.removeItem(k)})}catch(e){}$('up').textContent='מעדכן...';games.sc=0;loadAll()}
$('rf').onclick=refresh;
document.addEventListener('visibilitychange',function(){if(!document.hidden)loadAll()});
setInterval(function(){if(!document.hidden)loadAll()},18e4);
loadAll();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script></body></html>
